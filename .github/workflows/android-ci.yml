name: Android CI

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:
    branches:
      - main
      - "foundation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install Android 17 Preview SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager --sdk_root="$SDK_ROOT" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          # API 37 preview packages are published under android-37.0.
          # AGP resolves compileSdk 37 using the conventional android-37 path.
          if [[ -d "$SDK_ROOT/platforms/android-37.0" && ! -e "$SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
      - name: Run unit tests and assemble Debug APK
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: a55-wuwa-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
